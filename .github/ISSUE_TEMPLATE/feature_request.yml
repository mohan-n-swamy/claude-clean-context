name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep proposals aligned with the project's core constraints: the keep/demote
        path stays **deterministic** (no LLM in the loop), **standard-library only**,
        **dry-run by default**, and **never deletes** user data (move or report instead).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the toolkit doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should happen? A concrete before/after or example command helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one.
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the constraints
      options:
        - label: Keeps the keep/demote path deterministic (no LLM, stdlib only)
        - label: Preserves dry-run-by-default and never-deletes behavior
